spring.application.name=plataforma-academica
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:plataforma_academica_dev}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

server.servlet.session.timeout=30m
server.servlet.session.cookie.name=PAD_SESSAO
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false

seguranca.login.maximo-tentativas=5
seguranca.login.duracao-bloqueio-segundos=900
